name: alight_creators
description: Alight Creators - Alight Motion tutorials app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.0
  intl: ^0.19.0
  crypto: ^3.0.5
  bcrypt: ^1.1.3

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/icons/
    - assets/images/am-mascot.webp
    - assets/images/default-avatar.webp
    - assets/images/backgrounds/landing_background.webp
    - assets/seed/thumbnails/keep/
    - assets/seed/videos/

  fonts:
    - family: VarelaRound
      fonts:
        - asset: assets/fonts/VarelaRound-Regular.ttf
          weight: 400

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icons/foreground_image.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "assets/images/icons/background_image.png"
  adaptive_icon_foreground: "assets/images/icons/foreground_image.png"